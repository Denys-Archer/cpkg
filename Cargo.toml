[package]
name = "cpkg"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "cpkg"
path = "src/lib.rs"

[[bin]]
name = "cpkg"
path = "src/main.rs"

[dependencies]
zstd = { version = "0.13", features = ["zstdmt"] }
walkdir = "2.5"
globset = "0.4"
indicatif = "0.17"
sha2 = "0.10"
hex = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
